# Docker Compose 项目名（updater 容器内也需要一致）
# 如果 .env 里有 COMPOSE_PROJECT_NAME，会覆盖这里的值
name: asset-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: asset-postgres
    restart: always
    environment:
      POSTGRES_USER: asset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asset123}
      POSTGRES_DB: asset_platform
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset -d asset_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: asset-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: ghcr.io/rongsec/cyberlook:${APP_VERSION:-latest}
    container_name: asset-server
    restart: always
    ports:
      - "18888:18888"
    environment:
      SERVER_PORT: "18888"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-32b-instruct}
      PG_DSN: postgres://asset:${POSTGRES_PASSWORD:-asset123}@postgres:5432/asset_platform?sslmode=disable
      REDIS_ADDR: redis:6379
      # JWT_SECRET 不要写死在这里：首次启动会自动生成 32 字节随机密钥并保存到
      # /app/data/jwt.secret（已挂载到宿主机 ./data/files，重启不丢）。
      # 如需外部注入，改用 env_file 提供强随机值，不要用可猜测的字符串。
      # JWT_SECRET: <通过 env_file 注入>
    volumes:
      # 用 HOST_PROJECT_DIR 确保 updater 容器内路径与宿主机一致
      - ${HOST_PROJECT_DIR:-.}/data/files:/app/data
      - ${HOST_PROJECT_DIR:-.}/data/backup:/app/backup
      # v0.0.27：server 不再挂 tscan-config 卷（TscanPlus 已移除；
      # 引擎审计库只在 agent 本地 exe 同目录 config/，见 agent 服务挂载）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 更新边车：只有它能碰 docker.sock，主应用通过 HTTP 调它
  updater:
    image: ghcr.io/rongsec/cyberlook-updater:${APP_VERSION:-latest}
    container_name: asset-updater
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project
    working_dir: /project
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - server

  # 扫描节点：默认走内部网络。若要扫描宿主机所在内网，放开 network_mode: host 并改 -server 为 http://127.0.0.1:8080
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        # 不传这个，镜像里的二进制版本号就是 dev，节点每次心跳都会认为
        # "中心版本比我新"从而自我升级一次（多了 26MB 下载 + 一次重启）。
        VERSION: ${APP_VERSION:-dev}
    container_name: asset-agent
    restart: always
    # network_mode: host
    command: ["/app/scope-agent", "-server", "http://server:18888", "-name", "node-docker-1"]
    environment:
      # v0.0.27：全量指纹规则目录（镜像内已内置）。想用宿主机上的新规则覆盖镜像自带版本时，
      # 打开下面 volumes 里的只读挂载即可（改规则不用重建镜像）。
      SCAN_RULES_DIR: /app/data/fingerprint
      # 节点内并行单元数（默认 6）。调大前务必先抬 ulimit（见下），
      # 否则容器默认 nofile=1024 会把并发顶死在 ~1000 个 socket，表现为单元超时/被隔离。
      QUEUE_UNIT_CONCURRENCY: "6"
    ulimits:
      # 默认 1024 个 fd 只够 ~1000 个在途探针；自研引擎是 connect 扫描，每个探针一个 socket。
      # 想跑满 800+ pps（需 ≥1600 在途）必须放开。
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      # 引擎审计库持久化：agent exe 同目录 config/config.db（v0.0.27 起自研引擎写入）。
      # 卷名 v0.0.27.1 起由 agent-tscan-config 改为 agent-engine-config：
      # 它装的是**自研引擎**的审计库，与 tscan 无关（tscan 已彻底移除）。
      # ⚠️ 升级时旧卷不会自动迁移——审计库只用于排障，丢一次可接受；
      #    需保留旧数据时先拷过去再切：
      #    docker run --rm -v asset-platform_agent-tscan-config:/from \
      #      -v asset-platform_agent-engine-config:/to alpine cp -a /from/. /to/
      - agent-engine-config:/app/config
      # 可选：宿主机规则目录覆盖镜像内置规则（只读）。不用时保持注释即可。
      # - ./data/fingerprint:/app/data/fingerprint:ro
    depends_on:
      - server

volumes:
  pg-data:
  redis-data:
  # tscan-config：v0.0.27 移除（TscanPlus 已移除，server 不再需要 tscan 目录）。
  # 服务器上执行 `docker volume rm asset-platform_tscan-config` 清理旧卷。
  # agent-engine-config：agent 侧自研引擎审计库（config/config.db）。
  # 旧名 agent-tscan-config 不再声明，见 agent 服务挂载处的迁移说明。
  agent-engine-config:
