name: 发布前自检（敏感信息）

# 只做一件事：确认这次提交没有把密钥、内网地址、本机路径带进仓库。
# 它是本地的 scripts/audit-clean.sh 的远程副本，规则以脚本为准——
# 两边不一致时以脚本为准，因为本地钩子先于 CI 拦截。

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 历史扫描需要完整历史；浅克隆会让这一项静默失效
          fetch-depth: 0

      - name: 工作区 + 历史自检
        run: bash scripts/audit-clean.sh --history

      - name: gitleaks（可选，规则更全）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
