name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 计算小写镜像名
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送主镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送 updater 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.updater
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}-updater:${{ github.ref_name }}
            ghcr.io/${{ steps.img.outputs.name }}-updater:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: |
          echo "### 镜像已推送" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.img.outputs.name }}:${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.img.outputs.name }}-updater:${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
