name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    # 之前没设上限：arm64 在 QEMU 下装 chromium 卡满 6 小时才被 GitHub 掐掉，
    # 一次发版直接作废。留足余量，但必须有硬上限。
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只发 Docker Hub：国内有加速器生态，用户 docker pull rongsec/xxx 最短路径。
      # 凭据来自仓库 secrets（DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，PAT 需 Read & Write）。
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 只构建 linux/amd64，原生编译 5~8 分钟。
      # 不再走 multi-arch：arm64 那层在 QEMU 下装 chromium 实测 6 小时没跑完。
      - name: 构建并推送主镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_id }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送 updater 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.updater
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_id }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-updater:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-updater:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 节点镜像必须发：compose 里 agent 只声明 image、没有 build 段。
      # 少了它，一键部署就卡在拉不到 cyberlook-agent。
      - name: 构建并推送节点镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.agent
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_id }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-agent:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 发布自检：把刚推上去的镜像重新拉回来，让它自报版本与提交号。
      #
      # 为什么必须有这一步：CI 显示 success 只代表 push 请求被接受。曾经出现过
      # Docker Hub 上的 tag 内容其实是上一版（tag 同名、digest 未变），而流水线全绿——
      # 用户在本地拉到的仍是旧镜像，排查方向全错。
      # 现在的判据是镜像里二进制的 -version 输出：版本号 + 提交号都对得上才算发布成功。
      - name: 发布自检（拉回镜像校验版本与提交号）
        run: |
          set -e
          IMG="${{ secrets.DOCKERHUB_USERNAME }}/cyberlook:${{ github.ref_name }}"
          echo "== 拉回 $IMG =="
          docker pull "$IMG"
          docker images --digests "$IMG"
          OUT=$(docker run --rm --entrypoint /app/asset-server "$IMG" -version)
          echo "镜像内自报: $OUT"

          VER="${{ github.ref_name }}"; VER="${VER#v}"
          SHA="${{ github.sha }}"; SHA="${SHA:0:7}"
          echo "$OUT" | grep -q "$VER" || { echo "::error::版本号不匹配（期望 $VER）"; exit 1; }
          echo "$OUT" | grep -q "$SHA" || { echo "::error::提交号不匹配（期望 $SHA）——推上去的不是这次构建"; exit 1; }
          echo "自检通过：$VER / $SHA"

          # 控制文件一致性：主镜像内置的 amd64 agent 必须与 agent 镜像里的那份逐字节相同。
          # 不一致的后果很具体：容器节点每次心跳都被判定「控制文件需要升级」，
          # 升级写进容器可写层，容器一重建又回到镜像里那份，形成升级-回滚循环。
          # 两边都用 `-trimpath -ldflags="-s -w"`（不注入平台版本），构建可复现，所以必须相等。
          AGENT_IMG="${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-agent:${{ github.ref_name }}"
          docker pull "$AGENT_IMG"
          SHA_MAIN=$(docker run --rm --entrypoint sha256sum "$IMG" /app/agent/scope-agent-linux-amd64 | cut -d' ' -f1)
          SHA_AGENT=$(docker run --rm --entrypoint sha256sum "$AGENT_IMG" /app/scope-agent | cut -d' ' -f1)
          echo "主镜像内置 amd64: $SHA_MAIN"
          echo "节点镜像内:       $SHA_AGENT"
          [ "$SHA_MAIN" = "$SHA_AGENT" ] || { echo "::error::两个镜像的 agent 二进制不一致，容器节点会被误判需升级"; exit 1; }
          echo "控制文件指纹自检通过：${SHA_MAIN:0:8}"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # 不覆盖已有正文：正文由人工按 CHANGELOG 写（含"这一版修了什么"），
          # CI 只负责把镜像地址追加进去。否则每次发版都会把说明改成这段模板。
          append_body: true
          generate_release_notes: false
          body: |
            镜像已发布（linux/amd64）：

            ```
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook:${{ github.ref_name }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-updater:${{ github.ref_name }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-agent:${{ github.ref_name }}
            ```

            一键部署：

            ```
            git clone https://github.com/RongSec/CyberLook.git
            cd CyberLook && bash init.sh
            ```

      - name: 输出镜像地址
        run: |
          echo "### 镜像已推送" >> $GITHUB_STEP_SUMMARY
          for suffix in "" "-updater" "-agent"; do
            echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/cyberlook${suffix}:${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          done
