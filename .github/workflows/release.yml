name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    # 之前没设上限：arm64 在 QEMU 下装 chromium 卡满 6 小时才被 GitHub 掐掉，
    # 一次发版直接作废。留足余量，但必须有硬上限。
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只发 Docker Hub：国内有加速器生态，用户 docker pull rongsec/xxx 最短路径。
      # 凭据来自仓库 secrets（DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，PAT 需 Read & Write）。
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 只构建 linux/amd64，原生编译 5~8 分钟。
      # 不再走 multi-arch：arm64 那层在 QEMU 下装 chromium 实测 6 小时没跑完。
      - name: 构建并推送主镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送 updater 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.updater
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-updater:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-updater:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 节点镜像必须发：compose 里 agent 只声明 image、没有 build 段。
      # 少了它，一键部署就卡在拉不到 cyberlook-agent。
      - name: 构建并推送节点镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.agent
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-agent:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # 不覆盖已有正文：正文由人工按 CHANGELOG 写（含"这一版修了什么"），
          # CI 只负责把镜像地址追加进去。否则每次发版都会把说明改成这段模板。
          append_body: true
          generate_release_notes: false
          body: |
            镜像已发布（linux/amd64）：

            ```
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook:${{ github.ref_name }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-updater:${{ github.ref_name }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cyberlook-agent:${{ github.ref_name }}
            ```

            一键部署：

            ```
            git clone https://github.com/RongSec/CyberLook.git
            cd CyberLook && bash init.sh
            ```

      - name: 输出镜像地址
        run: |
          echo "### 镜像已推送" >> $GITHUB_STEP_SUMMARY
          for suffix in "" "-updater" "-agent"; do
            echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/cyberlook${suffix}:${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          done
