name: poc-yaml-hikvision-env-info
transport: http
  
rules:
  r0:
    request:
      method: GET
      path: /artemis-portal/artemis/env
    expression: response.status == 200 && response.body.bcontains(b'{"profiles":["prod"]') || response.body.bcontains(b'ENV=non-prod')
expression: r0()

