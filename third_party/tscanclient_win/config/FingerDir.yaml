# 主动指纹匹配路径配置
# 用于端口扫描和web指纹探测时对 HTTP/HTTPS 服务进行主动指纹匹配
# 格式说明：
#   paths: 要探测的路径列表
#   matchers: 匹配规则
#     - status: 期望的状态码列表
#     - body_contains: 响应体必须包含的关键词（任意一个匹配即可）
#     - body_not_contains: 响应体不能包含的关键词（用于排除误报）
#     - content_type: Content-Type 必须包含的关键词
#     - header_contains: 响应头必须包含的关键词

Alibaba-Nacos:
