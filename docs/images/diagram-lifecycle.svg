<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a">一台主机：从「一个 IP」到「一条可维护的资产记录」</text>
  <text x="24" y="55" font-size="12" fill="#64748b">同一套流水线每次重跑，只做增量更新；旧值与变化点全部留档，任何一次结论都能回溯到某一轮扫描。</text>

  <!-- Row 1 -->
  <!-- 1 -->
  <rect x="24" y="80" width="168" height="96" rx="8" fill="#f8fafc" stroke="#d5dce6"/>
  <circle cx="44" cy="102" r="11" fill="#e2e8f0"/><text x="44" y="106" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">1</text>
  <text x="62" y="107" font-size="13" font-weight="600" fill="#0f172a">IP 规划</text>
  <text x="36" y="131" font-size="11" fill="#475569">网段 / 台账导入</text>
  <text x="36" y="149" font-size="11" fill="#475569">免扫描清单（含 *.*.*.1）</text>
  <text x="36" y="167" font-size="11" fill="#94a3b8">→ 目标 IP 集合（已去重、已剔除）</text>

  <line x1="194" y1="128" x2="220" y2="128" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 2 -->
  <rect x="222" y="80" width="168" height="96" rx="8" fill="#f8fafc" stroke="#d5dce6"/>
  <circle cx="242" cy="102" r="11" fill="#e2e8f0"/><text x="242" y="106" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">2</text>
  <text x="260" y="107" font-size="13" font-weight="600" fill="#0f172a">存活探测</text>
  <text x="234" y="131" font-size="11" fill="#475569">ICMP 批量 → TCP 兜底</text>
  <text x="234" y="149" font-size="11" fill="#475569">抽样复核：漏判就降速重扫</text>
  <text x="234" y="167" font-size="11" fill="#94a3b8">→ 存活 IP（2% 存活也照实记账）</text>

  <line x1="392" y1="128" x2="418" y2="128" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 3 -->
  <rect x="420" y="80" width="168" height="96" rx="8" fill="#f8fafc" stroke="#d5dce6"/>
  <circle cx="440" cy="102" r="11" fill="#e2e8f0"/><text x="440" y="106" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">3</text>
  <text x="458" y="107" font-size="13" font-weight="600" fill="#0f172a">单元化排队</text>
  <text x="432" y="131" font-size="11" fill="#475569">1 IP = 1 单元（可重入）</text>
  <text x="432" y="149" font-size="11" fill="#475569">租约 60s + 心跳续租</text>
  <text x="432" y="167" font-size="11" fill="#94a3b8">→ 过期回收，节点掉线不丢进度</text>

  <line x1="590" y1="128" x2="616" y2="128" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 4 -->
  <rect x="618" y="80" width="168" height="96" rx="8" fill="#f8fafc" stroke="#d5dce6"/>
  <circle cx="638" cy="102" r="11" fill="#e2e8f0"/><text x="638" y="106" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">4</text>
  <text x="656" y="107" font-size="13" font-weight="600" fill="#0f172a">端口扫描</text>
  <text x="630" y="131" font-size="11" fill="#475569">单机令牌桶 + 全局限速</text>
  <text x="630" y="149" font-size="11" fill="#475569">代答端口剔除 / 全端口应答收敛</text>
  <text x="630" y="167" font-size="11" fill="#94a3b8">→ 开放端口及其证据</text>

  <line x1="788" y1="128" x2="814" y2="128" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 5 -->
  <rect x="816" y="80" width="160" height="96" rx="8" fill="#f8fafc" stroke="#d5dce6"/>
  <circle cx="836" cy="102" r="11" fill="#e2e8f0"/><text x="836" y="106" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">5</text>
  <text x="854" y="107" font-size="13" font-weight="600" fill="#0f172a">服务识别</text>
  <text x="828" y="131" font-size="11" fill="#475569">协议探针 → HTTP 抓页</text>
  <text x="828" y="149" font-size="11" fill="#475569">规则库 → 主动探针 → AI</text>
  <text x="828" y="167" font-size="11" fill="#94a3b8">→ 产品/版本/标题/响应码</text>

  <!-- Row 2 (right to left) -->
  <!-- 6 -->
  <rect x="816" y="222" width="160" height="96" rx="8" fill="#eef6ff" stroke="#bcd4f6"/>
  <circle cx="836" cy="244" r="11" fill="#dbeafe"/><text x="836" y="248" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">6</text>
  <text x="854" y="249" font-size="13" font-weight="600" fill="#0f172a">归一入库</text>
  <text x="828" y="273" font-size="11" fill="#475569">assets / services upsert</text>
  <text x="828" y="291" font-size="11" fill="#475569">首次发现 → 待处置</text>
  <text x="828" y="309" font-size="11" fill="#94a3b8">→ first_seen / last_seen</text>

  <line x1="814" y1="270" x2="788" y2="270" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 7 -->
  <rect x="618" y="222" width="168" height="96" rx="8" fill="#eef6ff" stroke="#bcd4f6"/>
  <circle cx="638" cy="244" r="11" fill="#dbeafe"/><text x="638" y="248" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">7</text>
  <text x="656" y="249" font-size="13" font-weight="600" fill="#0f172a">变更感知</text>
  <text x="630" y="273" font-size="11" fill="#475569">页面 SimHash + 标题/响应码</text>
  <text x="630" y="291" font-size="11" fill="#475569">旧值写入 prev_*，不就地覆盖</text>
  <text x="630" y="309" font-size="11" fill="#94a3b8">→ content_changed 标记</text>

  <line x1="616" y1="270" x2="590" y2="270" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 8 -->
  <rect x="420" y="222" width="168" height="96" rx="8" fill="#eef6ff" stroke="#bcd4f6"/>
  <circle cx="440" cy="244" r="11" fill="#dbeafe"/><text x="440" y="248" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">8</text>
  <text x="458" y="249" font-size="13" font-weight="600" fill="#0f172a">处置与归属</text>
  <text x="432" y="273" font-size="11" fill="#475569">新出现 / 新变更 / 台账导入</text>
  <text x="432" y="291" font-size="11" fill="#475569">系统名、责任人、部门</text>
  <text x="432" y="309" font-size="11" fill="#94a3b8">→ 确认即重建基准指纹</text>

  <line x1="418" y1="270" x2="392" y2="270" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 9 -->
  <rect x="222" y="222" width="168" height="96" rx="8" fill="#eef6ff" stroke="#bcd4f6"/>
  <circle cx="242" cy="244" r="11" fill="#dbeafe"/><text x="242" y="248" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">9</text>
  <text x="260" y="249" font-size="13" font-weight="600" fill="#0f172a">合规与证据</text>
  <text x="234" y="273" font-size="11" fill="#475569">可直连数据库等规则判定</text>
  <text x="234" y="291" font-size="11" fill="#475569">页面快照留存</text>
  <text x="234" y="309" font-size="11" fill="#94a3b8">→ 疑似 → 人工实连确认</text>

  <line x1="220" y1="270" x2="194" y2="270" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 10 -->
  <rect x="24" y="222" width="168" height="96" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <circle cx="44" cy="244" r="11" fill="#ffedd5"/><text x="44" y="248" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">10</text>
  <text x="62" y="249" font-size="13" font-weight="600" fill="#0f172a">缺席与归档</text>
  <text x="36" y="273" font-size="11" fill="#475569">每次未命中 miss_count + 1</text>
  <text x="36" y="291" font-size="11" fill="#475569">连续 3 次缺席才删除</text>
  <text x="36" y="309" font-size="11" fill="#94a3b8">→ 抗抖动，不因一次丢包误删</text>

  <!-- feedback loop: 7 -> 8 (change enters disposal) -->
  <path d="M702,222 L702,196 Q702,188 694,188 L604,188" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar3)"/>
  <text x="612" y="182" font-size="11" fill="#b45309">变更回流：改版 / 换服务 / 下线重开 都进处置队列</text>

  <!-- bottom: side channels -->
  <rect x="24" y="356" width="472" height="84" rx="8" fill="#f8fafc" stroke="#d5dce6" stroke-dasharray="4 3"/>
  <text x="40" y="378" font-size="12" font-weight="600" fill="#334155">旁路：审计库（节点本地 SQLite）</text>
  <text x="40" y="398" font-size="11" fill="#475569">每个单元一轮 = 一个 Project，记录 ipscan / urlscan 原始行；</text>
  <text x="40" y="416" font-size="11" fill="#475569">保留 7 天 / 512MB 上限，用于「这条结论从哪来」的取证复核。</text>

  <rect x="512" y="356" width="464" height="84" rx="8" fill="#f8fafc" stroke="#d5dce6" stroke-dasharray="4 3"/>
  <text x="528" y="378" font-size="12" font-weight="600" fill="#334155">旁路：任务日志 + 通知</text>
  <text x="528" y="398" font-size="11" fill="#475569">存活清单、判定/复核结论、参数行、识别结果逐条落库；</text>
  <text x="528" y="416" font-size="11" fill="#475569">任务完成 / 新资产 / 违规 / 故障 可按事件类型推送到企微、钉钉、飞书、邮件。</text>
</svg>
