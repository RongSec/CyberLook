<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(255,255,255,0)" />
      <stop offset="1" stop-color="rgba(255,255,255,0.9)" />
    </linearGradient>
  </defs>
  <!-- 外圆底 -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- 扫描扇形 -->
  <path d="M32 32 L32 4 A28 28 0 0 1 55 24 Z" fill="url(#sweep)" opacity="0.25"/>
  <!-- 同心圆刻度 -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="32" cy="32" r="6" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- 十字准线 -->
  <line x1="32" y1="4" x2="32" y2="60" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
  <!-- 扫描线 -->
  <line x1="32" y1="32" x2="32" y2="4" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- 中心点 -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
  <!-- 发现的资产光点 -->
  <circle cx="45" cy="19" r="2.6" fill="#4ade80"/>
  <circle cx="20" cy="42" r="2.2" fill="#4ade80" opacity="0.85"/>
  <circle cx="48" cy="45" r="1.8" fill="#4ade80" opacity="0.7"/>
</svg>
